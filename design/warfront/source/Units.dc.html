<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WARFRONT — Unit roster</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#020306}
a{color:#4dff7a}a:hover{color:#b6ffc9}
.sc .lbl{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#8fa3b5}
.sc .pnl{position:relative;background:linear-gradient(180deg,#2e3640 0%,#1a1f26 40%,#0f1318 100%);box-shadow:inset 0 0 0 1px #4f5c69,inset 0 1px 0 1px #9fb0c0,inset 0 0 0 3px #0b0e12,inset 0 0 0 4px #2a323b;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}
.sc .card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 6px 8px;background:#070a0e;box-shadow:inset 0 0 0 1px #2c3640}
.sc .stage{position:relative;width:100%;height:96px;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(ellipse 70% 30% at 50% 88%,rgba(150,140,90,.35),transparent 70%),radial-gradient(ellipse at 50% 40%,var(--glow),transparent 70%),#0b0f14}
.sc .stage .sp{width:62px;height:78px;display:block;overflow:visible;margin-bottom:4px;animation:wfBob 1.6s ease-in-out infinite}
.sc .stage .tw{width:54px;height:82px;display:block;overflow:visible}
.sc .nm{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e8ecf4;text-align:center}
.sc .cost{font-size:11px;font-weight:800;color:#ffcc33;text-shadow:0 0 6px rgba(255,204,51,.5)}
.sc .tm-red .tc{fill:#e5484d}.sc .tm-red .tcd{fill:#9e2328}
.sc .tm-blue .tc{fill:#3b82f6}.sc .tm-blue .tcd{fill:#1d4fb0}
.sc .sh{fill:rgba(0,0,0,.45)}
.sc .ln{fill:none;stroke-width:1.8px;stroke-linecap:round}
.sc .str{fill:none;stroke:#f2ecff;stroke-width:.6px}
.sc .rim{fill:none;stroke:#f59e0b;stroke-width:1.2px}
.sc .orb{filter:drop-shadow(0 0 3px #c084fc);animation:wfOrb 1.4s ease-in-out infinite}
.sc .fire{filter:drop-shadow(0 0 4px #ff8a00);animation:wfOrb .9s ease-in-out infinite}
.sc .rune{fill:none;stroke:#c084fc;stroke-width:.9px;stroke-dasharray:2 1.5;filter:drop-shadow(0 0 2px #c084fc);animation:wfRune 3s linear infinite}
.sc .aura{fill:rgba(192,132,252,.28);filter:drop-shadow(0 0 4px #c084fc);animation:wfOrb 1.8s ease-in-out infinite}
.sc .float{animation:wfFloat 2s ease-in-out infinite}
.sc .axe{transform-box:fill-box;transform-origin:50% 100%;animation:wfSway 2.2s ease-in-out infinite}
.sc .flag{transform-box:fill-box;transform-origin:0 50%;animation:wfFlag 1.1s ease-in-out infinite}
@keyframes wfBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes wfOrb{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes wfSway{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
@keyframes wfFlag{0%,100%{transform:scaleX(1) skewY(0)}50%{transform:scaleX(.8) skewY(8deg)}}
@keyframes wfFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes wfRune{to{stroke-dashoffset:-14}}
</style>
</helmet>
<div class="sc {{tm}}" style="width: 390px; min-height: 1120px; box-sizing: border-box; background: #020306; color: #d6e2ec; font-family: Bahnschrift, 'DIN Alternate', 'Arial Narrow', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; gap: 10px; padding: 10px">
  <div class="pnl" style="padding: 14px 16px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 18px; font-weight: 700; letter-spacing: .24em; color: #fff">UNIT ROSTER</span>
      <span class="lbl">3 races · 15 units · shown in {{teamName}}</span>
    </div>
    <span style="font-size: 10px; font-weight: 700; letter-spacing: .2em; padding: 5px 9px; color: #fff; background: {{teamColor}}">{{teamLabel}}</span>
  </div>

        <span class="lbl">{{r.tag}}</span>
