<!doctype html>
<html lang="en">

<helmet>
<style>
body{margin:0;background:#020306}
a{color:#4dff7a}a:hover{color:#b6ffc9}
.sc button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.sc .lbl{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#8fa3b5}
.sc .grn{color:#4dff7a;text-shadow:0 0 6px rgba(77,255,122,.55)}
.sc .amb{color:#ffcc33;text-shadow:0 0 6px rgba(255,204,51,.5)}
.sc .pnl{position:relative;background:linear-gradient(180deg,#2e3640 0%,#1a1f26 40%,#0f1318 100%);box-shadow:inset 0 0 0 1px #4f5c69,inset 0 1px 0 1px #9fb0c0,inset 0 0 0 3px #0b0e12,inset 0 0 0 4px #2a323b;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}
.sc .well{background:#05080b;box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px #2c3640,inset 0 0 18px rgba(0,0,0,.95)}
.sc .mbtn{min-height:56px;padding:0 12px;font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#cfe0ee;background:linear-gradient(180deg,#2b333d,#141920);box-shadow:inset 0 0 0 1px #4f5c69,inset 0 1px 0 1px rgba(255,255,255,.08);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
/* 2.5D scene */
.sc .cam{position:relative;overflow:hidden;perspective:900px;perspective-origin:50% 30%;background:radial-gradient(ellipse 90% 60% at 50% 0%,#2a0d10,#000 75%)}
.sc .world{position:absolute;transform-origin:50% 100%;transform:rotateX(40deg);transform-style:preserve-3d}
.sc .world sc-for,.sc .world sc-if{display:contents}
.sc .terrain{position:absolute;inset:0;overflow:hidden;background-color:#4f6a2a;background-image:radial-gradient(ellipse 260px 200px at 380px 240px,rgba(255,120,40,.22),transparent 70%),radial-gradient(ellipse 300px 220px at 120px 120px,rgba(255,236,170,.14),transparent 70%),radial-gradient(rgba(0,0,0,.2) 1px,transparent 1.7px),radial-gradient(rgba(190,230,120,.12) 1px,transparent 1.7px),radial-gradient(rgba(30,50,15,.35) 2px,transparent 3.2px),radial-gradient(rgba(150,120,70,.25) 3px,transparent 5px);background-size:auto,auto,4px 4px,7px 7px,17px 13px,41px 37px;background-position:0 0,0 0,0 0,2px 3px,5px 1px,11px 7px}
.sc .shore{position:absolute;width:108px;height:100px;border-radius:50%;background:radial-gradient(ellipse,#c2ad78 0 40%,rgba(194,173,120,0) 70%)}
.sc .water{position:absolute;width:88px;height:82px;background-color:#135a80;background-image:repeating-linear-gradient(165deg,rgba(170,230,255,.24) 0 1px,transparent 1px 8px),radial-gradient(ellipse,#08324f 0%,#0f4a6e 40%,#1b7096 75%);-webkit-mask-image:radial-gradient(ellipse,#000 50%,transparent 70%);mask-image:radial-gradient(ellipse,#000 50%,transparent 70%);animation:wfRipple 3s linear infinite}
.sc .ford{position:absolute;width:96px;height:76px;background:radial-gradient(ellipse,rgba(120,200,220,.55) 0 30%,rgba(120,200,220,.2) 55%,transparent 70%)}
.sc .floor{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(20,38,14,.9) 0 45%,rgba(20,38,14,0) 70%)}
.sc .scorch{position:absolute;width:80px;height:60px;border-radius:50%;background:radial-gradient(ellipse,#120c08 0 20%,rgba(40,25,12,.85) 35%,rgba(60,40,20,.4) 55%,transparent 72%)}
.sc .plat{position:absolute;transform-style:preserve-3d}
.sc .ptop{position:absolute;inset:0;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(25,35,12,.55),inset 0 0 22px rgba(0,0,0,.35)}
.sc .pt-stone{background-color:#6d7a4a;background-image:radial-gradient(ellipse 46% 44% at 50% 50%,rgba(150,150,128,.95) 0 92%,transparent 100%),radial-gradient(ellipse 40% 40% at 50% 60%,rgba(20,12,6,.75),transparent 70%),repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 1px,transparent 1px 22px)}
.sc .pw{position:absolute;background-color:#5a4a36}
.sc .pw-f{left:0;top:100%;width:100%;transform-origin:50% 0;transform:rotateX(-90deg);background-image:linear-gradient(180deg,#58772f 0 3px,rgba(0,0,0,0) 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 2px,transparent 2px 7px,rgba(255,255,255,.07) 7px 8px,transparent 8px 13px),linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.5));filter:brightness(.82)}
.sc .pw-l,.sc .pw-r{top:0;height:100%;transform-origin:0 50%;transform:rotateY(90deg);background-image:linear-gradient(90deg,#58772f 0 3px,rgba(0,0,0,0) 3px),repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 2px,transparent 2px 7px,rgba(255,255,255,.07) 7px 8px,transparent 8px 13px),linear-gradient(90deg,rgba(255,255,255,.06),rgba(0,0,0,.5))}
.sc .pw-l{left:0;filter:brightness(1.05)}
.sc .pw-r{left:100%;filter:brightness(.6)}
.sc .ramp{position:absolute;background-color:#8f8a70;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 2px,transparent 2px 10px);box-shadow:inset 0 0 0 2px rgba(0,0,0,.3)}
.sc .ent{position:absolute;width:0;height:0;transform-style:preserve-3d}
.sc .dec{position:absolute;left:0;top:0;transform:translate(-50%,-50%) translateZ(1px);border-radius:50%;pointer-events:none}
.sc .bb{position:absolute;left:0;bottom:0;transform-origin:50% 100%;transform:translateX(-50%) rotateX(-40deg)}
.sc .bb > svg{display:block;width:100%;height:100%;overflow:visible}
.sc .tshadow{width:46px;height:24px;margin-left:12px;margin-top:3px;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%)}
.sc .cglow{width:110px;height:80px;background:radial-gradient(ellipse,rgba(90,216,255,.55),rgba(90,216,255,.12) 45%,transparent 70%)}
.sc .glowc{filter:drop-shadow(0 0 6px rgba(90,216,255,.9))}
.sc .fireglow{width:260px;height:220px;background:radial-gradient(ellipse,rgba(255,120,30,.45),rgba(255,80,20,.12) 45%,transparent 70%);animation:wfOrb 1.2s ease-in-out infinite}
.sc .smoke{position:absolute;left:50%;bottom:0;width:0;height:0}
.sc .smoke span{position:absolute;left:-12px;bottom:0;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,rgba(70,66,64,.85),rgba(50,48,46,0) 70%);animation:wfSmoke 3s linear infinite}
.sc .smoke span:nth-child(2){animation-delay:-1s}.sc .smoke span:nth-child(3){animation-delay:-2s}
.sc .flame{position:absolute;width:18px;height:30px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 72%,#fff3b0 0 14%,#ffb347 34%,#ff5a1f 58%,rgba(255,60,0,0) 74%);transform-origin:50% 100%;animation:wfFlame .38s ease-in-out infinite alternate}
.sc .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
.sc .confetti i{position:absolute;top:-10px;width:5px;height:9px;animation:wfFall 3.2s linear infinite}
/* sprites */
.sc .tm-red .tc{fill:#e5484d}.sc .tm-red .tcd{fill:#9e2328}
.sc .tm-blue .tc{fill:#3b82f6}.sc .tm-blue .tcd{fill:#1d4fb0}
.sc .ln{fill:none;stroke-width:1.8px;stroke-linecap:round}
.sc .str{fill:none;stroke:#f2ecff;stroke-width:.6px}
.sc .orb{filter:drop-shadow(0 0 3px #c084fc);animation:wfOrb 1.4s ease-in-out infinite}
.sc .fire{filter:drop-shadow(0 0 4px #ff8a00);animation:wfOrb .9s ease-in-out infinite}
.sc .aura{fill:rgba(192,132,252,.28);filter:drop-shadow(0 0 4px #c084fc);animation:wfOrb 1.8s ease-in-out infinite}
.sc .axe{transform-box:fill-box;transform-origin:50% 100%;animation:wfSway 1.6s ease-in-out infinite}
.sc .flag{transform-box:fill-box;transform-origin:0 50%;animation:wfFlag 1.1s ease-in-out infinite}
.sc .sqbb{width:76px;height:74px;transform:translateX(-50%) rotateX(-40deg) scale(1.1)}
.sc .fig{position:absolute;width:34px;height:42px}
.sc .spw{position:absolute;inset:0}
.sc .sp{width:34px;height:42px;display:block;overflow:visible;animation:wfCheer .9s ease-in-out infinite}
.sc .d1 .sp{animation-delay:-.25s}.sc .d2 .sp{animation-delay:-.5s}.sc .d3 .sp{animation-delay:-.7s}
.sc .chip{position:absolute;top:-5px;right:-14px;font-size:10px;font-weight:800;padding:1px 6px 1px 4px;color:#fff;white-space:nowrap;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%);background:linear-gradient(180deg,#ff5a5f,#a8262b)}
.sc .sqsh{width:84px;height:46px;background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%)}
.sc .rg-red{width:70px;height:70px;border:1.5px solid rgba(255,90,95,.75);background:radial-gradient(circle,rgba(255,90,95,.14),transparent 70%)}
.sc .row{display:grid;grid-template-columns:42px minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:4px;align-items:center;min-height:50px;padding:0 10px 0 4px;font-size:13px}
.sc .row > span:nth-child(n+3){text-align:right;font-variant-numeric:tabular-nums}
.sc .por{width:38px;height:44px;display:grid;place-items:center;background:#0b0f14;box-shadow:inset 0 0 0 1px #2c3640}
.sc .por svg{width:32px;height:40px;overflow:visible}
@keyframes wfOrb{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes wfSway{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes wfFlag{0%,100%{transform:scaleX(1) skewY(0)}50%{transform:scaleX(.82) skewY(8deg)}}
@keyframes wfRipple{to{background-position:48px 0,0 0}}
@keyframes wfCheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes wfSmoke{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-110px) translateX(18px) scale(3);opacity:0}}
@keyframes wfFlame{0%{transform:scaleY(.82) scaleX(1.05)}100%{transform:scaleY(1.18) scaleX(.92)}}
@keyframes wfFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(280px) rotate(540deg);opacity:.2}}
@keyframes goPulse{0%,100%{text-shadow:0 0 18px rgba(255,90,95,.9),0 0 40px rgba(229,72,77,.6),0 3px 0 #000}50%{text-shadow:0 0 28px rgba(255,150,150,1),0 0 70px rgba(229,72,77,.9),0 3px 0 #000}}
</style>
</helmet>
<div class="sc" style="width: 390px; min-height: 780px; box-sizing: border-box; background: #020306; color: #d6e2ec; font-family: Bahnschrift, 'DIN Alternate', 'Arial Narrow', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; gap: 10px; padding: 0 0 12px">

  <!-- Victory scene -->
  <div style="position: relative">
    <div class="cam" style="width: 390px; height: 330px">
      <div class="world" style="left: -45px; top: -90px; width: 480px; height: 420px">
        <div class="terrain">
          <sc-for list="{{shores}}" as="b" hint-placeholder-count="5"><span class="shore" style="left: {{b.x}}px; top: {{b.y}}px"></span></sc-for>
          <sc-for list="{{waters}}" as="b" hint-placeholder-count="5"><span class="water" style="left: {{b.x}}px; top: {{b.y}}px"></span></sc-for>
          <span class="ford" style="left: 104px; top: 248px"></span>
          <span class="floor" style="left: -40px; top: 120px; width: 170px; height: 170px"></span>
          <span class="scorch" style="left: 300px; top: 345px"></span>
          <span class="scorch" style="left: 190px; top: 300px"></span>
          <span class="scorch" style="left: 410px; top: 370px"></span>
        </div>
        <div class="plat" style="left: 270px; top: 130px; width: 210px; height: 200px; transform: translateZ(36px)">
          <div class="pw pw-f" style="height: 36px"></div>
          <div class="pw pw-l" style="width: 36px"></div>
          <div class="pw pw-r" style="width: 36px"></div>
          <div class="ptop pt-stone"></div>
        </div>
        <div class="ramp" style="left: 200px; top: 220px; width: 70px; height: 64px; transform-origin: 100% 50%; transform: translateZ(36px) rotateY(-31deg)"></div>

        <sc-for list="{{trees}}" as="t" hint-placeholder-count="5">
          <div class="ent" style="left: {{t.x}}px; top: {{t.y}}px">
            <span class="dec tshadow"></span>
            <div class="bb" style="width: {{t.w}}px; height: {{t.h}}px">
              <sc-if value="{{t.pine}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 46 64" aria-hidden="true"><rect fill="#3b2a1a" x="21" y="48" width="4" height="15"></rect><path fill="#173a1b" d="M23 18 L41 51 L5 51 Z"></path><path fill="#22552a" d="M23 9 L37 39 L9 39 Z"></path><path fill="#2f7334" d="M23 1 L33 27 L13 27 Z"></path><path fill="#000" opacity=".25" d="M23 1 L33 27 L23 27 Z M23 9 L37 39 L23 39 Z M23 18 L41 51 L23 51 Z"></path></svg></sc-if>
              <sc-if value="{{t.leaf}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 46 64" aria-hidden="true"><path fill="#4a3220" d="M20 63 L21.5 38 L24.5 38 L26 63 Z"></path><circle fill="#1d4419" cx="23" cy="32" r="17"></circle><circle fill="#2b6425" cx="15" cy="27" r="11"></circle><circle fill="#306e29" cx="31" cy="25" r="11"></circle><circle fill="#3f8a33" cx="22" cy="19" r="11"></circle><circle fill="#5aa843" cx="19" cy="14" r="7"></circle><circle fill="#88c964" cx="17" cy="11" r="3.4"></circle></svg></sc-if>
            </div>
          </div>
        </sc-for>
        <sc-for list="{{bushes}}" as="t" hint-placeholder-count="6">
          <div class="ent" style="left: {{t.x}}px; top: {{t.y}}px"><div class="bb" style="width: 24px; height: 16px"><svg viewBox="0 0 24 16" aria-hidden="true"><ellipse fill="rgba(0,0,0,.35)" cx="13" cy="15" rx="11" ry="2"></ellipse><ellipse fill="#2c5a22" cx="7" cy="10" rx="6" ry="5"></ellipse><ellipse fill="#3d7a2c" cx="16" cy="9" rx="7" ry="6"></ellipse><ellipse fill="#5ea43d" cx="13" cy="6" rx="5" ry="4"></ellipse></svg></div></div>
        </sc-for>
        <div class="ent" style="left: 215px; top: 205px">
          <span class="dec cglow"></span>
          <div class="bb" style="width: 58px; height: 50px"><svg class="glowc" viewBox="0 0 54 46" aria-hidden="true"><path fill="#2a8fc0" d="M13 14 L18 21 L17 45 L10 45 L8 22 Z"></path><path fill="#2a8fc0" d="M41 9 L46 18 L44 45 L37 45 L36 18 Z"></path><path fill="#38b6e8" d="M27 1 L34 14 L31 45 L23 45 L20 14 Z"></path><path fill="#d6f8ff" opacity=".75" d="M27 1 L27 45 L23 45 L20 14 Z"></path></svg></div>
        </div>

        <!-- ruined Blue castle -->
        <div class="ent tm-blue" style="left: 375px; top: 300px; transform: translateZ(36px)">
          <span class="dec fireglow"></span>
          <div class="bb" style="width: 170px; height: 150px; transform: translateX(-50%) rotateX(-40deg) scale(.9)">
            <svg viewBox="0 0 100 88" aria-hidden="true">
              <path fill="#6b717b" d="M6 88 V46 L12 40 L16 47 L20 41 L24 48 V88 Z"></path>
              <path fill="#4a4f58" d="M76 88 V52 L81 45 L86 52 L90 46 L94 50 V88 Z"></path>
              <path fill="#5d636d" d="M16 88 V58 L22 54 L26 60 L30 52 L34 62 V88 Z"></path>
              <path fill="#7d8592" d="M36 88 V40 L42 30 L46 42 L52 28 L58 44 L64 38 V88 Z"></path>
              <path fill="#000" opacity=".28" d="M52 88 V28 L58 44 L64 38 V88 Z"></path>
              <path fill="#4f555e" d="M64 88 V60 L70 55 L74 62 L76 58 V88 Z"></path>
              <path fill="#14171c" d="M44 88 V74 Q50 66 56 74 V88 Z"></path>
              <path fill="#000" opacity=".45" d="M38 46 L60 46 L62 66 L36 66 Z"></path>
              <path class="tc" d="M46 52 L52 52 L52 64 L49 61 L46 66 Z" opacity=".85"></path>
              <path fill="#3a3e46" d="M2 88 L10 82 L22 85 L34 79 L48 86 L60 80 L72 86 L84 81 L98 88 Z"></path>
              <path fill="#2a2e35" d="M24 88 L28 84 L33 86 L30 88 Z M66 88 L70 83 L75 86 L73 88 Z"></path>
            </svg>
            <span class="flame" style="left: 64px; top: 30px"></span>
            <span class="flame" style="left: 80px; top: 24px; animation-delay: -.15s; transform: scale(1.2)"></span>
            <span class="flame" style="left: 22px; top: 62px; animation-delay: -.25s"></span>
            <span class="flame" style="left: 140px; top: 66px; animation-delay: -.1s; transform: scale(.85)"></span>
            <span class="flame" style="left: 112px; top: 74px; animation-delay: -.3s; transform: scale(.7)"></span>
            <span class="smoke" style="left: 48%; bottom: 120px"><span></span><span></span><span></span></span>
            <span class="smoke" style="left: 20%; bottom: 80px"><span></span><span></span><span></span></span>
            <span class="smoke" style="left: 84%; bottom: 84px"><span></span><span></span><span></span></span>
          </div>
        </div>

        <!-- planted Red banners -->
        <sc-for list="{{flags}}" as="g" hint-placeholder-count="3">
          <div class="ent tm-red" style="left: {{g.x}}px; top: {{g.y}}px; transform: translateZ({{g.z}}px)">
            <span class="dec tshadow" style="width: 30px; height: 14px"></span>
            <div class="bb" style="width: 34px; height: 64px"><svg viewBox="0 0 34 64" aria-hidden="true"><path class="ln" stroke="#3b2a1e" d="M4 2 L4 63"></path><circle fill="#f5c542" cx="4" cy="2" r="2.2"></circle><path class="tc flag" d="M5 5 L32 9 L26 18 L32 27 L5 27 Z"></path><path fill="#f5c542" d="M13 12 L15 16 L19 16 L16 19 L17 23 L13 21 L9 23 L10 19 L7 16 L11 16 Z"></path></svg></div>
          </div>
        </sc-for>

        <!-- victorious Red army -->
        <sc-for list="{{squads}}" as="q" hint-placeholder-count="5">
          <div class="ent" style="left: {{q.x}}px; top: {{q.y}}px; transform: translateZ({{q.z}}px)">
            <span class="dec sqsh"></span><span class="dec rg-red"></span>
            <div class="bb sqbb tm-red">
              <span class="chip">{{q.chip}}</span>
              <sc-for list="{{q.figs}}" as="f" hint-placeholder-count="3">
                <span class="{{f.cls}}" style="left: {{f.x}}px; top: {{f.y}}px"><span class="spw">
                  <sc-if value="{{f.k.archmage}}" hint-placeholder-val="{{ false }}"><svg class="sp" viewBox="0 0 32 40" aria-hidden="true"><ellipse class="aura" cx="16" cy="36.5" rx="13.5" ry="4.2"></ellipse><path class="tcd" d="M16 12 L4.5 37 Q16 40 27.5 37 Z"></path><path class="tc" d="M16 13 L8.5 36.5 Q16 39 23.5 36.5 Z"></path><path fill="#000" opacity=".22" d="M16 13 L16 38.6 Q20 38.5 23.5 36.5 Z"></path><path fill="#f5c542" d="M15.2 14 L16.8 14 L17.4 38.6 L14.6 38.6 Z"></path><circle fill="#e8c39e" cx="16" cy="10.8" r="3.2"></circle><path fill="#eef0f3" d="M12.8 11 Q16 23 19.2 11 Q16 13.6 12.8 11 Z"></path><ellipse fill="#331a63" cx="16" cy="8.4" rx="7.4" ry="1.9"></ellipse><path fill="#4a2a8a" d="M11.4 8.4 Q14 0 18.5 -6.5 Q18.6 1 20.6 8.4 Z"></path><circle fill="#f5c542" cx="16" cy="3.6" r="1"></circle><path class="ln" stroke="#7a5a3a" d="M27.4 2 L25.4 38"></path><path class="orb" fill="#e2c6ff" d="M27.6 -5 L30 -0.6 L27.6 3.6 L25.2 -0.6 Z"></path></svg></sc-if>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":780}}'>
class Component extends DCLogic {

    function squad(kind, icon, n, x, y, z) {
      var f = form[Math.min(n, 4)], kk = {}; kk[kind] = true;
      return { x: x, y: y, z: z, chip: icon + "×" + n, figs: f.map(function (p, m) { return { cls: "fig d" + m, x: p[0], y: p[1], k: kk }; }) };
    }
    var river = [[170,0],[166,70],[162,140],[158,200],[150,330],[146,400],[144,460]];
    function tree(x, y, s, pine) { return { x: x, y: y, w: Math.round(46 * s), h: Math.round(64 * s), pine: pine, leaf: !pine }; }
    function person(name, race, kind, team, kills, lost, dmg, mvp) {
      var kk = {}; kk[kind] = true;
      return { name: name, race: race, k: kk, tm: "tm-" + team, color: team === "red" ? "#ff7a7e" : "#7fb0ff", edge: team === "red" ? "#7a2a2e" : "#23477e",
        kills: kills, lost: lost, dmg: dmg, mvp: !!mvp, killCls: team === "red" ? "grn" : "", dmgCls: team === "red" ? "amb" : "" };
    }
    return {
      shores: river.map(function (p) { return { x: p[0] - 54, y: p[1] - 50 }; }),
      waters: river.map(function (p) { return { x: p[0] - 44, y: p[1] - 41 }; }),
      trees: [tree(40, 210, 1.1, true), tree(84, 180, 1, false), tree(20, 260, 1.1, false), tree(70, 240, 0.9, true), tree(250, 150, 0.95, false)],
      bushes: [{ x: 110, y: 330 }, { x: 230, y: 300 }, { x: 60, y: 390 }, { x: 250, y: 410 }, { x: 190, y: 250 }, { x: 460, y: 410 }],
      flags: [{ x: 296, y: 150, z: 36 }, { x: 462, y: 320, z: 36 }, { x: 290, y: 318, z: 36 }],
      squads: [squad("archer", "🏹", 3, 220, 300, 0), squad("archmage", "🪄", 1, 210, 360, 0), squad("warrior", "🗡️", 4, 75, 370, 0), squad("battlemage", "🔥", 3, 310, 405, 0), squad("berserker", "🪓", 2, 410, 400, 0)],
      board: [
        person("KAI", "HORDE", "berserker", "red", 14, 6, 72, true),

        person("NOA", "FORGE", "militia", "blue", 7, 12, 34),
        person("ELI", "HORDE", "warrior", "blue", 5, 13, 22)

    };
  }
}
