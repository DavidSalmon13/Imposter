<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WARFRONT — Forge and Horde command cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#020306}
a{color:#4dff7a}a:hover{color:#b6ffc9}
.sc button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.sc .lbl{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#8fa3b5}
.sc .amb{color:#ffcc33;text-shadow:0 0 6px rgba(255,204,51,.5)}
.sc .pnl{position:relative;background:linear-gradient(180deg,#303843 0%,#1a2028 30%,#0e1216 100%);box-shadow:inset 0 0 0 1px #4f5c69,inset 0 1px 0 1px #93a4b4,inset 0 0 0 3px #0b0e12,inset 0 0 0 4px #2a323b;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}
.sc .well{background:#05080b;box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px #2c3640,inset 0 0 18px rgba(0,0,0,.95)}
.sc .cmd{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-height:88px;padding-bottom:5px;box-sizing:border-box;box-shadow:inset 0 0 0 1px #46525e,inset 0 0 0 2px #06080a,inset 0 0 14px rgba(0,0,0,.9);border-radius:3px}
.sc .f .cmd{background:radial-gradient(ellipse 80% 22% at 50% 70%,rgba(150,130,90,.45),transparent 70%),radial-gradient(ellipse at 50% 40%,#3a2a0e 0%,#1a1308 60%,#0b0f13 100%)}
.sc .h .cmd{background:radial-gradient(ellipse 80% 22% at 50% 70%,rgba(150,120,90,.45),transparent 70%),radial-gradient(ellipse at 50% 40%,#3e1010 0%,#1c0808 60%,#0b0f13 100%)}
.sc .cmd .hk{position:absolute;top:3px;left:5px;font-size:10px;font-weight:800;color:#ffcc33}
.sc .cmd .cc{position:absolute;top:3px;right:4px;font-size:10px;font-weight:800;color:#ffcc33}
.sc .cmd .cs{width:40px;height:50px;position:relative}
.sc .cmd .cs svg{width:40px;height:50px;display:block;overflow:visible;animation:wfBob 1.6s ease-in-out infinite}
.sc .cmd .cn{font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.1;text-align:center;padding:0 2px}
.sc .f .cn{color:#f1d9a6}.sc .h .cn{color:#efe3cc}
.sc .cmd.struct{box-shadow:inset 0 0 0 2px #8b93a1,inset 0 0 0 3px #06080a,inset 0 0 14px rgba(245,158,11,.25);border-radius:0}
.sc .cmd .tag{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:6.5px;font-weight:800;letter-spacing:.14em;color:#8b93a1}
.sc .cmd.on{box-shadow:inset 0 0 0 1px #4dff7a,inset 0 0 0 2px #06080a,inset 0 0 16px rgba(77,255,122,.35),0 0 10px rgba(77,255,122,.4)}
.sc .cmd.dim{opacity:.38;filter:grayscale(.85)}
.tm-red .tc{fill:#e5484d}.tm-red .tcd{fill:#9e2328}
.sc .sh{fill:rgba(0,0,0,.45)}
.sc .ln{fill:none;stroke-width:1.8px;stroke-linecap:round}
.sc .str{fill:none;stroke:#f2ecff;stroke-width:.6px}
.sc .rim{fill:none;stroke:#f59e0b;stroke-width:1.2px}
.sc .axe{transform-box:fill-box;transform-origin:50% 100%;animation:wfSway 2.2s ease-in-out infinite}
.sc .flag{transform-box:fill-box;transform-origin:0 50%;animation:wfFlag 1.1s ease-in-out infinite}
@keyframes wfBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes wfSway{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
@keyframes wfFlag{0%,100%{transform:scaleX(1) skewY(0)}50%{transform:scaleX(.8) skewY(8deg)}}
</style>
</helmet>

    <span>Arcane's command card is shown live on the Battlefield screen. Every race uses the same console; only the glow colour and roster change.</span>
  </div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    function mk(list, gold, sel) {
      return list.map(function (x) {
        var kk = {}; kk[x[0]] = true;
        return { k: kk, name: x[1], cost: x[2], hk: x[3], struct: x[0] === "bastion",
          cls: "cmd" + (x[0] === "bastion" ? " struct" : "") + (x[0] === sel ? " on" : "") + (x[2] > gold ? " dim" : ""),
          aria: "Recruit " + x[1] + ", costs " + x[2] };
      });
    }
    return {
      cards: [
        { cls: "f", title: "⚒️ FORGE · COMMAND CARD", color: "#ffbf3c", glow: "rgba(245,158,11,.5)", gold: 6, noteColor: "#a8916a",
          note: "Iron + amber · structures get square iron frames",
          units: mk([["militia","Militia-man",3,"M"],["crossbow","Crossbow",4,"C"],["outrider","Outrider",5,"O"],["bastion","Bastion",6,"B"],["ballista","Ballista",6,"L"]], 6, "bastion") },
        { cls: "h", title: "⚔️ HORDE · COMMAND CARD", color: "#efe3cc", glow: "rgba(220,38,38,.7)", gold: 7, noteColor: "#b58f86",
          note: "Blood + bone · Warchief greyed: not enough 💰",
          units: mk([["warrior","Warrior",3,"W"],["skirmisher","Skirmish-er",4,"S"],["raider","Raider",5,"R"],["berserker","Berserker",5,"B"],["warchief","Warchief",8,"C"]], 7, "berserker") }
      ]
    };
  }
}
