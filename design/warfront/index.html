<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WARFRONT — UI mockup</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #05070a; color: #d6e2ec; font-family: Bahnschrift, 'DIN Alternate', 'Arial Narrow', 'Segoe UI', system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px; background: #11151a; box-shadow: inset 0 -1px 0 #2c3640; }
  header h1 { margin: 0 10px 0 0; font-size: 16px; letter-spacing: .24em; color: #fff; }
  header h1 span { color: #ff5a5f; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  nav button { font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; min-height: 36px; padding: 0 12px; color: #cfe0ee; background: #1a2028; border: 1px solid #3d4955; cursor: pointer; }
  nav button[aria-pressed="true"] { color: #4dff7a; border-color: #4dff7a; box-shadow: inset 0 0 10px rgba(77,255,122,.25); }
  main { display: flex; justify-content: center; padding: 16px 0 40px; }
  iframe { width: 390px; height: 1200px; border: 0; background: #020306; box-shadow: 0 0 0 1px #2c3640, 0 20px 60px rgba(0,0,0,.6); }
</style>
</head>
<body>
<header>
  <h1>WAR<span>FRONT</span></h1>
  <nav aria-label="Screens">
    <button data-src="1-team-select.html" data-h="1330" aria-pressed="false">1 · Team select</button>
    <button data-src="2-battlefield.html" data-h="1090" aria-pressed="true">2 · Battlefield</button>
    <button data-src="2b-unit-roster.html" data-h="1120" aria-pressed="false">2b · Unit roster</button>
    <button data-src="2c-command-cards.html" data-h="480" aria-pressed="false">2c · Command cards</button>
    <button data-src="3-resolution.html" data-h="1240" aria-pressed="false">3 · Resolution</button>
    <button data-src="4-game-over.html" data-h="780" aria-pressed="false">4 · Game over</button>
  </nav>
</header>
<main><iframe id="screen" title="WARFRONT screen" src="2-battlefield.html" style="height: 1090px"></iframe></main>
<script>
  var frame = document.getElementById('screen');
  document.querySelectorAll('nav button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('nav button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      frame.src = b.dataset.src;
      frame.style.height = b.dataset.h + 'px';
    });
  });
</script>
</body>
</html>
